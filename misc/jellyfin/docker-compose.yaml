services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/sakis/.local/share/jellyfin/config:/config
      # - /home/sakis/.local/share/jellyfin/transcode:/transcode
      - /home/sakis/Videos/Series:/data/tvshows
      - /home/sakis/Videos/Movies:/data/movies
    ports:
      - 8096:8096
      - 8920:8920
    restart: unless-stopped
